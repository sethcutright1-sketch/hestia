<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Household</title>
    <!-- Lets a fridge/tablet's "Add to Home Screen" launch this as an app
         shortcut instead of a bookmark, which some browser engines present
         without their own address bar. display_override tries true
         fullscreen first; display is the safe fallback for engines that
         don't know display_override. Speculative -- whether the fridge's
         own browser honors any of this depends on what engine it runs (see
         GET /ua and README.md's "Kitchen display" section). -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      // Sets the dark class before first paint, from every page load -- not just
      // ones that happen to mount the budget section -- so there's no flash and
      // grocery/pantry/meal-plan stay correctly themed even if budget is never
      // opened this session.
      (function () {
        var stored = localStorage.getItem("household_dark");
        var dark = stored === null ? matchMedia("(prefers-color-scheme: dark)").matches : stored === "true";
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
